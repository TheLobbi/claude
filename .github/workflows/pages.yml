name: Deploy GitHub Pages

# Builds the marketplace catalog data from the manifest and publishes the
# static site in site/ to GitHub Pages. Runs on pushes to the default branch
# (so the catalog never drifts from marketplace.json) and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.claude-plugin/marketplace.json'
      - 'plugins/**/.claude-plugin/plugin.json'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of this workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate &amp; validate catalog data
        run: |
          node scripts/build-site.mjs
          node scripts/check-site.mjs

      - name: Configure Pages
        # enablement: true auto-provisions the Pages site on first run so no
        # manual Settings → Pages toggle is required (needs pages: write).
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
