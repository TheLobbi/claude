<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b3d"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#ff6b3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="url(#grad)"/>
    <text x="32" y="46" font-size="38" text-anchor="middle" fill="#fff" font-weight="800">⌁</text>
    <text x="84" y="42" font-size="30" fill="#ecedf3" font-weight="800">claude<tspan fill="#71748c" font-weight="600">·orchestration</tspan></text>
  </g>

  <!-- headline -->
  <text x="80" y="290" font-size="78" font-weight="900" fill="#ecedf3" letter-spacing="-2">The orchestration layer</text>
  <text x="80" y="378" font-size="78" font-weight="900" letter-spacing="-2">
    <tspan fill="#ecedf3">for </tspan><tspan fill="url(#grad)">Claude Code.</tspan>
  </text>

  <!-- stat chips -->
  <g font-size="26" font-weight="700">
    <g transform="translate(80, 470)">
      <rect width="220" height="84" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="24" y="40" fill="url(#grad)" font-size="40" font-weight="850">35</text>
      <text x="24" y="68" fill="#a7a9bd" font-size="20" font-weight="600">plugins</text>
    </g>
    <g transform="translate(320, 470)">
      <rect width="220" height="84" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="24" y="40" fill="url(#grad)" font-size="40" font-weight="850">261</text>
      <text x="24" y="68" fill="#a7a9bd" font-size="20" font-weight="600">agents</text>
    </g>
    <g transform="translate(560, 470)">
      <rect width="220" height="84" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="24" y="40" fill="url(#grad)" font-size="40" font-weight="850">250</text>
      <text x="24" y="68" fill="#a7a9bd" font-size="20" font-weight="600">skills</text>
    </g>
    <g transform="translate(800, 470)">
      <rect width="220" height="84" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="24" y="40" fill="url(#grad)" font-size="40" font-weight="850">294</text>
      <text x="24" y="68" fill="#a7a9bd" font-size="20" font-weight="600">commands</text>
    </g>
  </g>

  <!-- accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#grad)"/>
</svg>
